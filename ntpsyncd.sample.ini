; ntpsyncd settings - copy to C:\Data\ntpsyncd.ini
;
; One setting per line, key=value. Everything after ';' or '#' is a comment.
; Changes apply at the next sync, or at once on Sync now in the NTP Time Sync app.
; Saving settings in the app rewrites this file in this layout, without any
; comments you added. Log: C:\Data\ntpsyncd.log

; NTP servers, tried in order until one answers. Up to 5; more are ignored.
; With no server= line at all it uses vn.pool.ntp.org, asia.pool.ntp.org
; and pool.ntp.org.
server=vn.pool.ntp.org
server=asia.pool.ntp.org
server=pool.ntp.org
server=time.cloudflare.com    ; a fallback outside the pool

; Wi-Fi access points ntpsyncd may switch on by itself, tried in order.
; With none enabled it only syncs while a Wi-Fi connection is already up,
; and checks again every 10 minutes until it succeeds.
;
; The numbers are this phone's access point IDs. Easiest: tick your Wi-Fi
; in NTP Time Sync > Settings > Wi-Fi access points. The ini ntpsyncd writes
; also lists every Wi-Fi access point as ";iap=<ID>    ; <name>".
;
; Only Wi-Fi access points are used: a packet data ID, an ID that no longer
; exists, or Easy WLAN is skipped, with a line in the log. Remove the ';'
; in front of a line to enable it.
;iap=3    ; HomeWifi
;iap=7    ; OfficeWifi

; Minutes between syncs, 15 to 10080 (one week).
interval=360

; Leave the clock alone if it is off by less than this many milliseconds
; (0 to 600000).
threshold=500

; 1 = re-sync 30 s after something else (network operator time, another
; app) changes the clock, at most once per 15 minutes. 0 = only on schedule.
watch=1

; 1 = sync in the background. 0 = the daemon stops, and stays off after a
; restart (Stop / Start background sync in the app set this).
enabled=1
